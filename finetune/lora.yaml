# LoRA settings for finetune/train.sh (mlx_lm.lora --config)
model: finetune/out/base-qat-4bit
train: true
data: finetune/out/data
fine_tune_type: lora
mask_prompt: true          # the loss is on the answer, not on the prompt
num_layers: -1             # every layer
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.0
optimizer: adamw
learning_rate: 1.0e-4
batch_size: 4
grad_checkpoint: true
max_seq_length: 768
steps_per_report: 25
steps_per_eval: 200
val_batches: 25
save_every: 200
seed: 12
