name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v1.1.0 && git push origin v1.1.0

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - uses: actions/checkout@v4

      - name: Create release archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="textpolish-${VERSION}.zip"
          # Only the app: .gitattributes marks docs, video, design, benchmarks
          # and tests as export-ignore.
          git archive --format=zip --prefix="textpolish-${VERSION}/" -o "$ARCHIVE" "$VERSION"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Write release notes
        run: |
          # This version's section of CHANGELOG.md, then the install steps.
          awk -v v="${VERSION#v}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[[0-9.]+\]:/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Install (macOS)

          Requires [Ollama](https://ollama.com) 0.40 or later. Extract the zip, then:

          \`\`\`bash
          ollama pull gemma4:e2b-it-qat   # one-time, 4.3 GB
          cd textpolish-${VERSION}
          bash setup.sh
          \`\`\`

          \`setup.sh\` creates a Python venv, installs the dependencies and puts **TextPolish.app** on your Desktop. Windows (experimental): see the [README](https://github.com/Enguerrand-Roques/textpolish#readme).
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TextPolish ${{ env.VERSION }}"
          body_path: notes.md
          files: ${{ env.ARCHIVE }}
          draft: false
          prerelease: false
